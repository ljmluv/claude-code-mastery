<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-lg shadow-xl p-6 w-80">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Calculator</h1>

        <input
            type="text"
            id="display"
            class="w-full text-right text-4xl font-bold p-4 border-2 border-gray-300 rounded-lg mb-4 bg-gray-50"
            value="0"
            readonly
        >

        <div class="grid grid-cols-4 gap-3">
            <!-- Row 1 -->
            <button class="btn btn-secondary" data-action="clear">C</button>
            <button class="btn btn-secondary" data-action="delete">DEL</button>
            <button class="btn btn-secondary" data-action="operator">÷</button>
            <button class="btn btn-secondary" data-action="operator">×</button>

            <!-- Row 2 -->
            <button class="btn btn-primary" data-number="7">7</button>
            <button class="btn btn-primary" data-number="8">8</button>
            <button class="btn btn-primary" data-number="9">9</button>
            <button class="btn btn-secondary" data-action="operator">−</button>

            <!-- Row 3 -->
            <button class="btn btn-primary" data-number="4">4</button>
            <button class="btn btn-primary" data-number="5">5</button>
            <button class="btn btn-primary" data-number="6">6</button>
            <button class="btn btn-secondary" data-action="operator">+</button>

            <!-- Row 4 -->
            <button class="btn btn-primary" data-number="1">1</button>
            <button class="btn btn-primary" data-number="2">2</button>
            <button class="btn btn-primary" data-number="3">3</button>
            <button class="btn btn-secondary" data-action="operator">.</button>

            <!-- Row 5 -->
            <button class="btn btn-primary col-span-2" data-number="0">0</button>
            <button class="btn btn-secondary col-span-2" data-action="equals">=</button>
        </div>
    </div>

    <style>
        .btn {
            @apply font-bold py-4 rounded-lg text-lg transition-all duration-200 active:scale-95;
        }
        .btn-primary {
            @apply bg-blue-500 text-white hover:bg-blue-600;
        }
        .btn-secondary {
            @apply bg-orange-500 text-white hover:bg-orange-600;
        }
    </style>

    <script>
        const display = document.getElementById('display');
        let currentValue = '0';
        let previousValue = '';
        let operation = null;
        let shouldResetDisplay = false;

        function updateDisplay() {
            display.value = currentValue;
        }

        function handleNumber(num) {
            if (shouldResetDisplay) {
                currentValue = num;
                shouldResetDisplay = false;
            } else {
                currentValue = currentValue === '0' ? num : currentValue + num;
            }
            updateDisplay();
        }

        function handleOperator(op) {
            if (operation && !shouldResetDisplay) {
                calculate();
            }
            previousValue = currentValue;
            operation = op;
            shouldResetDisplay = true;
        }

        function calculate() {
            if (!operation || shouldResetDisplay) return;

            let result;
            const prev = parseFloat(previousValue);
            const current = parseFloat(currentValue);

            switch(operation) {
                case '+':
                    result = prev + current;
                    break;
                case '−':
                    result = prev - current;
                    break;
                case '×':
                    result = prev * current;
                    break;
                case '÷':
                    result = current === 0 ? 'Error' : prev / current;
                    break;
                default:
                    return;
            }

            currentValue = String(result);
            operation = null;
            shouldResetDisplay = true;
            updateDisplay();
        }

        function clear() {
            currentValue = '0';
            previousValue = '';
            operation = null;
            shouldResetDisplay = false;
            updateDisplay();
        }

        function deleteLastChar() {
            if (currentValue.length > 1) {
                currentValue = currentValue.slice(0, -1);
            } else {
                currentValue = '0';
            }
            updateDisplay();
        }

        document.querySelectorAll('[data-number]').forEach(btn => {
            btn.addEventListener('click', () => handleNumber(btn.textContent));
        });

        document.querySelectorAll('[data-action]').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.dataset.action;
                if (action === 'operator') {
                    handleOperator(btn.textContent);
                } else if (action === 'equals') {
                    calculate();
                } else if (action === 'clear') {
                    clear();
                } else if (action === 'delete') {
                    deleteLastChar();
                }
            });
        });
    </script>
</body>
</html>
